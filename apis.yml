description: Focal Communications Corporation was a Chicago-based competitive local exchange carrier
  (CLEC) founded in 1996 that provided switched local phone and data services to large, communications-intensive
  business customers in Tier I US markets. Backed by Battery Ventures, Madison Dearborn and Frontenac, it
  went public in 1998, filed Chapter 11 in December 2002, emerged from reorganization in July 2003, and was
  acquired by Corvis Communications (later Broadwing) in 2004. The company is defunct and operates no public
  API, developer portal, or documentation surface; this network profile is a historical stub and no live
  API artifacts exist to enrich.
